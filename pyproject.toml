[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-ai-reconciliation-agent"
version = "0.1.0"
description = "Autonomous FinTech Payment Reconciliation & Dispute Resolution Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
site-package-path = [".venv/lib/python3.9/site-packages"]
